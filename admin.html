<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#202938}
header{background:#172554;color:white;padding:20px}
main{max-width:1000px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0000000a}
input,button{padding:12px;border-radius:7px;border:1px solid #ddd;width:100%;margin:7px 0;font-size:15px}
button{background:#1d4ed8;color:white;border:0;cursor:pointer}
button.delete{background:#dc2626;width:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat strong{display:block;font-size:28px;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:550px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}
.table-wrap{overflow-x:auto}
.hidden{display:none}
#message{margin-top:10px;color:#b91c1c}
@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h2>Registration Dashboard</h2>
<p>Administrator Panel</p>
</header>

<main>
<section id="login" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Administrator email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Overview</h2>
<div class="stats">
<div class="stat">Total Registrations<strong id="total">0</strong></div>
<div class="stat">Today's Registrations<strong id="today">0</strong></div>
</div>
<button onclick="loadRegistrations()">Refresh Data</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h2>Registered Users</h2>
<input id="search" placeholder="Search by name or email" oninput="displayRegistrations()">
<div class="table-wrap">
<table>
<thead>
<tr><th>Name</th><th>Email</th><th>Date</th><th>Action</th></tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
<p id="status"></p>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://hgaywdgygjagtypnryfs.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let registrations = [];

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Signing in...";

  const {error} = await client.auth.signInWithPassword({email,password});

  if(error){
    message.textContent = error.message;
    return;
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  await loadRegistrations();
}

async function loadRegistrations(){
  const status = document.getElementById("status");
  status.textContent = "Loading registrations...";

  const {data,error} = await client
    .from("registrations")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    status.textContent = error.message;
    return;
  }

  registrations = data || [];
  document.getElementById("total").textContent = registrations.length;

  const today = new Date().toDateString();
  const todayCount = registrations.filter(item =>
    new Date(item.created_at).toDateString() === today
  ).length;

  document.getElementById("today").textContent = todayCount;
  status.textContent = registrations.length + " registration(s) found.";
  displayRegistrations();
}

function displayRegistrations(){
  const search = document.getElementById("search").value.toLowerCase();
  const records = document.getElementById("records");

  const filtered = registrations.filter(item =>
    item.full_name.toLowerCase().includes(search) ||
    item.email.toLowerCase().includes(search)
  );

  records.innerHTML = "";

  filtered.forEach(item => {
    const row = document.createElement("tr");

    const name = document.createElement("td");
    name.textContent = item.full_name;

    const email = document.createElement("td");
    email.textContent = item.email;

    const date = document.createElement("td");
    date.textContent = new Date(item.created_at).toLocaleString();

    const action = document.createElement("td");
    const button = document.createElement("button");
    button.textContent = "Delete";
    button.className = "delete";
    button.onclick = () => deleteRegistration(item.id);
    action.appendChild(button);

    row.append(name,email,date,action);
    records.appendChild(row);
  });
}

async function deleteRegistration(id){
  if(!confirm("Are you sure you want to delete this registration?")) return;

  const {error} = await client
    .from("registrations")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await loadRegistrations();
}

async function logout(){
  await client.auth.signOut();
  registrations = [];
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("password").value = "";
  document.getElementById("message").textContent = "";
}

async function checkSession(){
  const {data} = await client.auth.getSession();

  if(data.session){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    await loadRegistrations();
  }
}

checkSession();
</script>
</body>
</html>
