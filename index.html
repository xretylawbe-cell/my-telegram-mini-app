<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 25px 18px;
  color: #172033;
}
.container {
  max-width: 420px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
}
h2 { color: #2481cc; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #2481cc;
  color: white;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}
button:disabled { opacity: .6; }
.hidden { display: none; }
#status { margin-top: 15px; line-height: 1.5; }
</style>
</head>
<body><div class="container" id="home">
  <h2>Welcome!</h2>
  <p>Welcome to your registration application.</p>
  <button id="registerButton">Register Now</button>
</div><div class="container hidden" id="register">
  <h2>Create Account</h2>
  <form id="registrationForm">
    <input id="name" placeholder="Full name"
      maxlength="100" required>
    <input id="email" type="email"
      placeholder="Email address" maxlength="254" required>
    <button id="submitButton" type="submit">
      Submit Registration
    </button>
  </form>
  <p id="status" role="status"></p>
  <button id="backButton">Go Back</button>
</div><div class="container hidden" id="success">
  <h2>Registration Complete!</h2>
  <p id="successMessage"></p>
  <button id="homeButton">Return Home</button>
</div><script>
const SUPABASE_URL =
  "https://hgaywdgygjagtypnryfs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5ggvkl1i7IlezKsVK1AfUw_ewxOOauv";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function showPage(page) {
  document.querySelectorAll('.container').forEach(el => {
    el.classList.add('hidden');
  });
  document.getElementById(page).classList.remove('hidden');
}

document.getElementById('registerButton').onclick =
  () => showPage('register');

document.getElementById('backButton').onclick =
  () => showPage('home');

document.getElementById('homeButton').onclick =
  () => showPage('home');

document.getElementById('registrationForm')
.addEventListener('submit', async function(event) {
  event.preventDefault();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const button = document.getElementById('submitButton');
  const status = document.getElementById('status');

  if (!name || !email) return;

  button.disabled = true;
  button.textContent = 'Submitting...';
  status.textContent = '';

  try {
    const response = await fetch(
      SUPABASE_URL + '/rest/v1/registrations',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          full_name: name,
          email: email
        })
      }
    );

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.message || 'Registration failed');
    }

    document.getElementById('successMessage').textContent =
      'Thank you, ' + name + '! Your registration was saved.';

    document.getElementById('registrationForm').reset();
    showPage('success');

  } catch (error) {
    status.textContent = 'Error: ' + error.message;
  } finally {
    button.disabled = false;
    button.textContent = 'Submit Registration';
  }
});
</script></body>
</html>
