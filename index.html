<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 25px 18px;
  color: #172033;
}
.container {
  max-width: 420px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
}
h2 { color: #2481cc; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #2481cc;
  color: white;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}
.hidden { display: none; }
</style>
</head>
<body><div class="container" id="home">
  <h2>Welcome!</h2>
  <p>Welcome to your first registration application.</p>
  <button onclick="showPage('register')">Register Now</button>
</div><div class="container hidden" id="register">
  <h2>Create Account</h2>
  <form id="registrationForm">
    <input id="name" placeholder="Full name" required>
    <input id="email" type="email" placeholder="Email address" required>
    <button type="submit">Submit Registration</button>
  </form>
  <button onclick="showPage('home')">Go Back</button>
</div><div class="container hidden" id="success">
  <h2>Registration Complete!</h2>
  <p id="successMessage"></p>
  <button onclick="showPage('home')">Return Home</button>
</div><script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function showPage(page) {
  document.querySelectorAll('.container').forEach(el => {
    el.classList.add('hidden');
  });
  document.getElementById(page).classList.remove('hidden');
}

document.getElementById('registrationForm')
.addEventListener('submit', function(event) {
  event.preventDefault();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!name || !email) return;

  document.getElementById('successMessage').textContent =
    'Thank you, ' + name + '! Your form has been completed.';

  showPage('success');
});
</script></body>
</html>
