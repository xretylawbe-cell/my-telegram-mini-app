<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Telegram Mini App</title>  <script src="https://telegram.org/js/telegram-web-app.js"></script>  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f1f5f9;
      color: #172033;
    }

    .app {
      max-width: 400px;
      margin: 40px auto;
      padding: 28px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 18px #00000010;
    }

    h1 {
      color: #2481cc;
      font-size: 26px;
    }

    p {
      line-height: 1.6;
      color: #526176;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #16834a;
    }
  </style></head><body>
  <div class="app">
    <h1>Welcome! 👋</h1><p>Your first Telegram Mini App is ready to begin.</p>

<p>Tap the button below to test your app.</p>

<button id="testButton">Tap Me</button>

<div id="message"></div>

  </div>  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();

    document.getElementById("testButton").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "Success! Your app button is working. 🎉";

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
    });
  </script></body>
</html>
